[project]
name = "excalibur"
version = "0.1.0"
description = "Excalibur — autonomous OBS director and routing engine for gaming streams."
requires-python = ">=3.11"
dependencies = [
  "mss>=9.0.1",
  "numpy>=1.26.0",
  "opencv-python>=4.9.0.80",
  "obsws-python>=1.7.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "pyzmq>=25.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
]
cv-cpu = [
  "onnxruntime>=1.17.0",
]
cv-gpu = [
  "onnxruntime-gpu>=1.17.0",
]
cv-train = [
  "torch>=2.2.0",
  "ultralytics>=8.2.0",
  "label-studio-sdk>=1.0.0",
]

[project.scripts]
excalibur = "excalibur.main:main"
excalibur-matrix = "excalibur.matrix.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excalibur"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
