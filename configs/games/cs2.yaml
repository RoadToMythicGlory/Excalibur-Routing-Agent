game: "Counter-Strike 2"

events:
  - name: "player_1_critical_survival"
    category: "survival"
    scene: "CS2 - Player 1"
    description: "Player 1 appears to be low health; hold the POV for the clutch moment."
    priority: 90
    hold_sec: 6.0
    stable_frames: 2
    interrupt: true
    rules:
      - type: "region_color"
        source: "player_1"
        region: [40, 930, 220, 95]
        lower_bgr: [0, 0, 120]
        upper_bgr: [90, 90, 255]
        min_ratio: 0.18

