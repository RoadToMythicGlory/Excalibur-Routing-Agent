game: "Counter-Strike 2"

version: "1.0.0"

runtime:
  config_type: "auto_director_rules"
  resolution: [1920, 1080]
  color_space: "BGR"
  note: "Full expanded YAML for 10 CS2 player POV feeds plus observer. No templates or placeholders required."

defaults:
  fallback_scene: "CS2 - Observer"
  decision_tick_ms: 250
  min_cut_gap_sec: 1.2
  default_hold_sec: 3.0
  max_hold_sec: 8.0
  stable_frames: 2
  rule_mode: "any"
  return_to_observer_after_idle_sec: 2.0

matrix:
  enabled: true
  program_output: "output_01"
  preview_output: "output_02"
  multiview_output: "output_03"
  clean_output: "output_04"

sources:
  observer:
    kind: "observer"
    scene: "CS2 - Observer"
    output_route_source: "observer"
  player_1:
    kind: "player_pov"
    scene: "CS2 - Player 1"
    output_route_source: "input_01"
  player_2:
    kind: "player_pov"
    scene: "CS2 - Player 2"
    output_route_source: "input_02"
  player_3:
    kind: "player_pov"
    scene: "CS2 - Player 3"
    output_route_source: "input_03"
  player_4:
    kind: "player_pov"
    scene: "CS2 - Player 4"
    output_route_source: "input_04"
  player_5:
    kind: "player_pov"
    scene: "CS2 - Player 5"
    output_route_source: "input_05"
  player_6:
    kind: "player_pov"
    scene: "CS2 - Player 6"
    output_route_source: "input_06"
  player_7:
    kind: "player_pov"
    scene: "CS2 - Player 7"
    output_route_source: "input_07"
  player_8:
    kind: "player_pov"
    scene: "CS2 - Player 8"
    output_route_source: "input_08"
  player_9:
    kind: "player_pov"
    scene: "CS2 - Player 9"
    output_route_source: "input_09"
  player_10:
    kind: "player_pov"
    scene: "CS2 - Player 10"
    output_route_source: "input_10"

scoring:
  enabled: true
  weights:
    kill_feed_detected: 120
    double_kill_detected: 160
    triple_kill_detected: 220
    clutch_1v1: 180
    clutch_1v2: 150
    clutch_1v3: 130
    low_health: 65
    sniper_scoped_action: 55
    bomb_planted: 110
    defuse_started: 170
    molotov_throw: 45
    grenade_throw: 38
    flashbang_throw: 35
    smoke_throw: 30
    molotov_fire_impact: 40
    active_combat: 25
  decay:
    kill_sec: 6
    objective_sec: 8
    utility_sec: 3
    combat_sec: 2
    clutch_sec: 10

cut_rules:
  - name: "never_cut_too_fast"
    type: "cooldown"
    min_gap_sec: 1.2
  - name: "major_events_can_interrupt"
    type: "interrupt_priority"
    min_priority: 90
  - name: "prefer_current_source_when_score_close"
    type: "score_margin"
    margin: 15
  - name: "return_to_observer_when_idle"
    type: "fallback"
    scene: "CS2 - Observer"
    after_idle_sec: 2.0
  - name: "do_not_cut_to_unhealthy_source"
    type: "source_health_gate"
    require_healthy: true

observer_events:
  - name: "kill_feed_detected"
    category: "kill"
    source: "observer"
    target_source: "dynamic"
    scene: "dynamic"
    description: "Detect new kill feed entry and route to killer POV if mapped."
    priority: 100
    hold_sec: 5.0
    stable_frames: 1
    interrupt: true
    rules:
      - type: "kill_feed_change"
        source: "observer"
        region: [1320, 80, 560, 260]
        min_new_entries: 1

  - name: "double_kill_detected"
    category: "kill"
    source: "observer"
    target_source: "dynamic"
    scene: "dynamic"
    description: "Same player gets two kills inside a short window."
    priority: 115
    hold_sec: 6.0
    stable_frames: 1
    interrupt: true
    rules:
      - type: "kill_feed_multi"
        source: "observer"
        region: [1320, 80, 560, 260]
        same_player_kills: 2
        window_sec: 5

  - name: "triple_kill_detected"
    category: "kill"
    source: "observer"
    target_source: "dynamic"
    scene: "dynamic"
    description: "Same player gets three kills inside a short window."
    priority: 130
    hold_sec: 7.0
    stable_frames: 1
    interrupt: true
    rules:
      - type: "kill_feed_multi"
        source: "observer"
        region: [1320, 80, 560, 260]
        same_player_kills: 3
        window_sec: 7

  - name: "clutch_1v1"
    category: "clutch"
    source: "observer"
    target_source: "dynamic"
    scene: "dynamic"
    description: "Only one player alive on each team."
    priority: 125
    hold_sec: 7.0
    stable_frames: 1
    interrupt: true
    rules:
      - type: "alive_count"
        source: "observer"
        team_a_alive: 1
        team_b_alive: 1

  - name: "clutch_1v2"
    category: "clutch"
    source: "observer"
    target_source: "dynamic"
    scene: "dynamic"
    description: "One player alive against two opponents."
    priority: 115
    hold_sec: 6.5
    stable_frames: 1
    interrupt: true
    rules:
      - type: "alive_count"
        source: "observer"
        one_side_alive: 1
        other_side_alive: 2

  - name: "clutch_1v3"
    category: "clutch"
    source: "observer"
    target_source: "dynamic"
    scene: "dynamic"
    description: "One player alive against three opponents."
    priority: 105
    hold_sec: 6.0
    stable_frames: 1
    interrupt: true
    rules:
      - type: "alive_count"
        source: "observer"
        one_side_alive: 1
        other_side_alive: 3

  - name: "bomb_planted"
    category: "objective"
    source: "observer"
    scene: "CS2 - Observer"
    description: "Bomb planted. Prefer observer unless a higher priority fight is active."
    priority: 95
    hold_sec: 4.0
    stable_frames: 1
    interrupt: true
    rules:
      - type: "template"
        source: "observer"
        region: [760, 40, 400, 120]
        template_path: "../assets/templates/cs2/bomb_planted.png"
        threshold: 0.78

  - name: "defuse_started"
    category: "objective"
    source: "observer"
    target_source: "dynamic"
    scene: "dynamic"
    description: "Defuse started. Cut to defuser POV if mapped, otherwise observer."
    priority: 120
    hold_sec: 6.0
    stable_frames: 1
    interrupt: true
    rules:
      - type: "template"
        source: "observer"
        region: [760, 760, 420, 160]
        template_path: "../assets/templates/cs2/defuse_bar.png"
        threshold: 0.75

  - name: "observer_round_transition"
    category: "round_state"
    source: "observer"
    scene: "CS2 - Observer"
    description: "Observer view during scoreboard, round transition, or broad round state."
    priority: 10
    hold_sec: 3.0
    stable_frames: 2
    rules:
      - type: "region_brightness"
        source: "observer"
        region: [640, 90, 640, 110]
        operator: "above"
        threshold: 160

  - name: "scoreboard_open"
    category: "round_state"
    source: "observer"
    scene: "CS2 - Observer"
    description: "Scoreboard is open. Prefer observer."
    priority: 12
    hold_sec: 2.5
    stable_frames: 2
    rules:
      - type: "template"
        source: "observer"
        region: [320, 120, 1280, 760]
        template_path: "../assets/templates/cs2/scoreboard_layout.png"
        threshold: 0.72

events:
  - name: "player_1_critical_survival"
